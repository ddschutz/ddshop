  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #c0392b;
      --red-dark: #922b21;
      --orange: #e67e22;
      --cream: #fdf6e3;
      --kraft: #c8a96e;
      --kraft-dark: #9a7d4a;
      --dark: #2c1a0e;
      --ink: #1a0f00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: var(--cream);
      position: relative;
      overflow-x: hidden;
    }

    /* Fond image avec overlay */
    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url('1000026091.jpg');
      background-size: cover;
      background-position: center top;
      z-index: 0;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg,
        rgba(253,246,227,0.88) 0%,
        rgba(192,57,43,0.18) 50%,
        rgba(253,246,227,0.92) 100%);
      z-index: 1;
    }

    /* Motif demi-teinte comic */
    .bg-halftone {
      position: fixed;
      inset: 0;
      z-index: 2;
      background-image: radial-gradient(circle, rgba(192,57,43,0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
    }

    /* Titre principal style comic */
    .title-box {
      text-align: center;
      margin-bottom: 1.2rem;
      position: relative;
    }

    .title-box h1 {
      font-family: 'BaBoom', cursive;
      font-size: 3rem;
      letter-spacing: 3px;
      color: var(--red);
      text-shadow:
        3px 3px 0 var(--ink),
        -1px -1px 0 var(--ink),
        1px -1px 0 var(--ink),
        -1px 1px 0 var(--ink);
      line-height: 1;
    }

    .title-box .subtitle {
      font-family: 'BaBoom', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--dark);
      background: var(--kraft);
      display: inline-block;
      padding: 2px 14px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      margin-top: 4px;
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* Bulle de dialogue style BD */
    .speech-bubble {
      background: white;
      border: 3px solid var(--ink);
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      margin-bottom: 1.2rem;
      position: relative;
      box-shadow: 4px 4px 0 var(--ink);
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--dark);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      border: 9px solid transparent;
      border-top-color: var(--ink);
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: white;
      z-index: 1;
    }

    /* Carte principale */
    .card {
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 6px 6px 0 var(--ink);
    }

    /* Section label */
    .section-label {
      font-family: 'BaBoom', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--red);
      border-bottom: 2px dashed var(--kraft);
      padding-bottom: 4px;
      margin-bottom: 0.8rem;
    }

    /* Inputs */
    .inputs-row {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.5rem;
      font-size: 1.1rem;
      font-family: 'BaBoom', cursive;
      border: 2.5px solid var(--ink);
      border-radius: 0.5rem;
      text-align: center;
      background: white;
      color: var(--dark);
      box-shadow: 3px 3px 0 var(--kraft-dark);
      transition: box-shadow 0.15s, transform 0.15s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      outline: none;
      box-shadow: 3px 3px 0 var(--red);
      transform: translate(-1px, -1px);
    }

    /* Chrono */
    .chrono-section {
      margin-bottom: 1.2rem;
    }

    #chrono {
      font-family: 'BaBoom', cursive;
      font-size: 3rem;
      letter-spacing: 6px;
      color: var(--dark);
      text-align: center;
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: 0.5rem;
      padding: 0.3rem;
      box-shadow: 3px 3px 0 var(--ink);
      margin-bottom: 0.8rem;
      position: relative;
    }
    #chrono.running {
      color: var(--red);
      animation: pulse-chrono 1s ease-in-out infinite;
    }
    @keyframes pulse-chrono {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
    }

    /* Boutons */
    button {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      border: 2.5px solid var(--ink);
      border-radius: 0.5rem;
      cursor: pointer;
      padding: 0.55rem 0.9rem;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 3px 3px 0 var(--ink);
      flex: 1;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn-start  { background: #27ae60; color: white; }
    .btn-stop   { background: var(--orange); color: white; }
    .btn-reset  { background: #7f8c8d; color: white; }

    .btn-generate {
      width: 100%;
      background: var(--red);
      color: white;
      font-size: 1.3rem;
      padding: 0.8rem;
      margin-bottom: 0.7rem;
      box-shadow: 4px 4px 0 var(--red-dark);
    }
    .btn-generate:hover { background: var(--red-dark); }
    .btn-generate:active { box-shadow: 1px 1px 0 var(--red-dark); }

    .btn-copy {
      width: 100%;
      background: var(--kraft);
      color: var(--ink);
      font-size: 1.1rem;
      padding: 0.7rem;
      display: none;
      box-shadow: 4px 4px 0 var(--kraft-dark);
    }
    .btn-copy:hover { background: var(--kraft-dark); color: white; }

    /* Résultat */
    #result {
      margin-top: 0.8rem;
      padding: 1rem;
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: 0.5rem;
      box-shadow: 3px 3px 0 var(--ink);
      font-style: normal;
      display: none;
      white-space: pre-line;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--dark);
      position: relative;
    }
    #result.visible {
      display: block;
      animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop-in {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Badge erreur */
    #result.error {
      background: #fdecea;
      border-color: var(--red);
      color: var(--red);
      font-style: normal;
      font-weight: 700;
    }

    /* Séparateur */
    .divider {
      border: none;
      border-top: 2px dashed var(--kraft);
      margin: 1.2rem 0;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-halftone"></div>

  <div class="container">

    <div class="title-box">
      <h1>A Carnivore<br>Did It !</h1>
      <div class="subtitle">🔍 Publication réseaux</div>
    </div>

    <div class="speech-bubble">
      Tu as résolu une énigme ?<br>Renseigne le feuillet et la ligne ci-dessous 👇
    </div>

    <div class="card">

      <!-- Champs -->
      <div class="section-label">📋 L'énigme</div>
      <div class="inputs-row">
        <div class="input-group">
          <label>Feuillet</label>
          <input type="number" id="page" placeholder="1–20" min="1" max="20">
        </div>
        <div class="input-group">
          <label>Ligne</label>
          <input type="number" id="ligne" placeholder="1–100" min="1" max="100">
        </div>
      </div>

      <!-- Chronomètre -->
      <div class="chrono-section">
        <div class="section-label">⏱ Chronomètre</div>
        <div id="chrono">00:00</div>
        <div class="btn-row">
          <button class="btn-start" onclick="startChrono()">▶ Start</button>
          <button class="btn-stop"  onclick="stopChrono()">⏸ Stop</button>
          <button class="btn-reset" onclick="resetChrono()">↺ Reset</button>
        </div>
      </div>

      <hr class="divider">

      <!-- Génération -->
      <button class="btn-generate" onclick="genererTexte()">🕵️ Générer le post !</button>
      <button class="btn-copy" id="copyBtn" onclick="copierTexte()">📋 Copier</button>

      <div id="result"></div>

    </div>
  </div>

  <script>
    let chronoInterval;
    let timeInSeconds = 0;

    function updateChronoDisplay() {
      const m = String(Math.floor(timeInSeconds / 60)).padStart(2, '0');
      const s = String(timeInSeconds % 60).padStart(2, '0');
      document.getElementById('chrono').textContent = `${m}:${s}`;
    }

    function startChrono() {
      if (chronoInterval) return;
      document.getElementById('chrono').classList.add('running');
      chronoInterval = setInterval(() => {
        timeInSeconds++;
        updateChronoDisplay();
      }, 1000);
    }

    function stopChrono() {
      clearInterval(chronoInterval);
      chronoInterval = null;
      document.getElementById('chrono').classList.remove('running');
    }

    function resetChrono() {
      stopChrono();
      timeInSeconds = 0;
      updateChronoDisplay();
      const result = document.getElementById('result');
      result.style.display = 'none';
      result.className = '';
      document.getElementById('copyBtn').style.display = 'none';
    }

    function genererTexte() {
      const page   = document.getElementById('page').value.trim();
      const ligne  = document.getElementById('ligne').value.trim();
      const result = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');

      result.className = '';

      if (!page || !ligne) {
        result.className = 'error visible';
        result.style.display = 'block';
        result.textContent = "⚠️ Merci de renseigner le feuillet et la ligne !";
        copyBtn.style.display = 'none';
        return;
      }

      const m = String(Math.floor(timeInSeconds / 60)).padStart(2, '0');
      const s = String(timeInSeconds % 60).padStart(2, '0');
      const temps = `${m}:${s}`;

      const texte =
`A carnivore did it #j2s
J'ai réussi l'enquête niveau ${page}, numéro ${ligne} en ${temps} !
Et toi, tu y es arrivé ?

#acarnivoredidit #acdi #horribleguild #j2s`;

      result.className = 'visible';
      result.style.display = 'block';
      result.textContent = texte;
      copyBtn.style.display = 'block';
    }

    function copierTexte() {
      const texte = document.getElementById('result').textContent;
      navigator.clipboard.writeText(texte).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = "✅ Copié !";
        setTimeout(() => btn.textContent = "📋 Copier", 1800);
      });
    }
  </script>
</body>
</html>
